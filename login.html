<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 판다마켓</title>
  <link rel="stylesheet" href="./login_signup.css" />
  <link rel="stylesheet" href="./reset.css" />
</head>

  <body class="entire" >
    <main class="container">
      <section class="logo_pandamarket">
        <a href="/index.html">
          <img src="/logo_pandamarket.svg" alt="로고" />
        </a>
      </section>
      <div class="form-container">
        <form class="login-wrapper" method="post" action="/index.html" >
          <section class="email">
            <h2 class="text">이메일</h2>
            <input class="text-input" type="email" name="userName" placeholder="이메일을 입력해주세요" required>
            <div id="emailError" class="error-message"></div>
          </section>
          <section class="pswd">
            <h2 class="text">비밀번호</h2>
            <div class="input-wrapper">
              <input class="text-input" type="password" name="userPassword" placeholder="비밀번호를 입력해주세요" required>
              <div id="passwordError" class="error-message"></div>
              <button type="button" class="btn-visibility">
                <img src="btn_visibility_on_24px.png" alt="비밀번호 표시" />
              </button>
            </div>
          </section>
          <section>
            <button type="submit" class="login" id="loginButton" disabled>
              <div class="login-text">로그인</div>
            </button>
          </section>
          <section class="easylogin" >
            <div class="inner">
              <h2 class="e-l-text">간편 로그인하기</h2>
            <div class="google-kakao">
              <a href="https://www.google.com/" target="_blank">
                <img src="/google.png" alt="구글페이지" />
              </a>
              <a href="https://www.kakaocorp.com/page/" target="_blank">
                <img src="/kakao.svg" alt="카카오페이지" />
              </a>
            </div>
            </div>
          </section>
          <section class="text-to-signup">
            <h2 class="first-login-text">판다마켓이 처음이신가요?</h2>
            <a class="signup-link" href="/signup.html">회원가입</a>
          </section>
          </div>
        </form>
      </div>
      <script src="form-login.js"></script>
    </main>
  </body>
  <div id="errorModal" class="modal">
    <div class="modal-content">
      <p id="modalMessage">아이디 혹은 비밀번호가 일치하지 않습니다.</p>
      <button id="modalConfirmButton">확인</button>
    </div>
  </div>
</html>
