<!DOCTYPE html>

<html>
    <head>
        <title>로그인</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="./css/login_style.css">
    </head>

    <body>
        <main>
            <a class="logo-title link" href="index.html">
                <img class="logo-icon" src="./image/panda_logo.svg" alt="판다 로고 아이콘">
                <h1>판다마켓</h1>
            </a>
            <form>
                <div class="email inputbox">
                    <label class="label" for="email">이메일</label>
                    <input
                    id="email" 
                    class=""
                    name="email" 
                    placeholder="이메일을 입력해주세요" 
                    type="email"
                    autocomplete="off">
                </div>
                <div class="password inputbox">
                    <label class="label" for="password">비밀번호</label>
                    <input
                    id="password"
                    class=""
                    name="password"
                    placeholder="비밀번호를 입력해주세요"
                    type="password">
                </div>
                <button class="login-button" type="submit">
                    <div class="login-button-text">로그인</div>
                </button>
            </form>

            <section class="simple-login">
                <div class="simple-login-main">
                    <p class="simple-login-text">간편 로그인하기</p>
                    <a class="google link" href="https://www.google.com/">
                        <img src="./image/google.svg" alt="구글 아이콘">
                    </a>
                    <a class="kakaotalk link" href="https://www.kakaocorp.com/page/">
                        <img src="./image/kakaotalk.svg" alt="카카오톡 아이콘">
                    </a>
                </div>
            </section>

            <div class="signup-main">
                판다마켓이 처음이신가요?
                <a class="signup link" href="signup.html">회원가입</a>
            </div>

        </main>

        <script type="module" src="script.js"></script>

    </body>
</html>
