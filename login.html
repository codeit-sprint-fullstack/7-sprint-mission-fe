<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="reset.css"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loginstyle.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

</head>
<body>
  <header></header>
  <main>
    <div class="login_box">   <!--가운데 박스-->
      <div class="logo_box_botgap">
        <div class="login_logo">
          <a href="/"><img src="./img/icon_panda.svg" rel="판다아이콘"/></a>
          <p class="rokaf_font">판다마켓</p>
        </div> 
      </div>  <!--로고-->
      <div>
      <form>    <!--이메일 ,비밀번호 로그인-->
        <div class="email_box"> <!--이메일-->
          <label class="email_box_label">이메일</label>
          <input type="email" placeholder="이메일을 입력해주세요" class="focus_line validation_id"/>
        </div> 
        <div class="password_box"> <!--비밀번호-->
          <label class="email_box_label">비밀번호</label>
          <div class="input_icon_box">
          <input type="password" placeholder="비밀번호을 입력해주세요" class="passwordTarget focus_line validation_pw"/>
          <i class="fa-solid fa-eye-slash icon_eye icon_position"></i>
        </div>
        </div>
        <button class="login_button" type="button" disabled>로그인</button>
      </form>
    </div>
      <div class="conv_login">
        <div>
          <p>간편 로그인하기</p>
        </div>
        <div class="conv_login_gap">
          <a href="https://www.google.com/%E2%80%9D"><img src="./img/Component 2.png"/></a>
          <a href="https://www.kakaocorp.com/page/%E2%80%9D"><img src="./img/component1.png"/></a>
        </div>
      </div>  <!--간편로그인-->
      <div>
        <p class="signup_text">판다마켓이 처음이신가요? <a class="signup" href="/signup">회원가입</a></p>
      </div>  <!--회원가입 칸-->
    </div>
    <div class="overlay">

    </div>
    <!-- 모달창 -->
    <div class="login_modal"> <!--모달창을 감싸는 div -->
      <div class="modal_box">  <!--모달창내에서 가운데-->
        <p>비밀번호가 일치하지않습니다.</p>
        <button class="modal_button">확인</button>
      </div>
    </div>
  </main>
  <footer></footer>
<script type="module" src="login.js"></script>
</body>
</html>
