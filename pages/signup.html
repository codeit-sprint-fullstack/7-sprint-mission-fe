<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/signup.css">
    <link rel="icon" href="../assets/images/branding/ic_panda_logo.svg">
    <title>Signup</title>
</head>
<body>
    <main class="main-container">
        <div class="signup-container">

            <!-- 상단 로고 -->
            <a class="branding" href="../index.html">
                <img class="panda-logo" src="../assets/images/branding/ic_panda_logo.svg" alt="판다 로고 이미지">
                <h1 class="site-name">판다마켓</h1>
            </a>

            <!-- 회원가입 폼 -->
            <form class="signup-form" action="#" method="post">

                <div class="form-group">
                    <label class="form-label" for="user-email" >이메일</label>
                    <input  type="email" class="form-input" id="user-email" placeholder="이메일을 입력해주세요"/>
                    <p class="error-message hide">이메일을 입력해주세요.</p>
                    <p class="error-message hide">잘못된 이메일 형식입니다.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="user-nickname">닉네임</label>
                    <input type="text" class="form-input" id="user-nickname" placeholder="닉네임을 입력해주세요"/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="user-password">비밀번호</label>
                    <div class="form-password">
                        <input type="password"class="form-input" id="user-password" placeholder="비밀번호를 입력해주세요"/>
                        <button type="button" class="visibility-btn clickable"><img src="../assets/images/icons/btn_visibility_off_24px.svg"/></button>
                        <p class="error-message hide" data-error-for="password">에러 메세지</p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="check-user-password">비밀번호 확인</label>
                    <div class="form-password">
                        <input type="password"class="form-input" id="check-user-password" placeholder="비밀번호를 다시 한 번 입력해주세요"/>
                        <button type="button" class="visibility-btn clickable"><img src="../assets/images/icons/btn_visibility_off_24px.svg"/></button>
                        <p class="error-message hide" data-error-for="check-password">에러</p>
                    </div>  
                </div>

                <button type="button" class="form-btn clickable">회원가입</button>
            </form>

            <!-- 간편 로그인 -->
            <div class="login-social">
                <h2 class="social-title">간편 로그인하기</h2>
                <div class="social-btn">
                    <a href="https://www.google.com/"><img src="../assets/images/icons/ic_google.png" alt="구글 로고 이미지"/></a>
                    <a href="https://www.kakaocorp.com/page/"><img src="../assets/images/icons/ic_kakaotalk.png" alt="카카오톡 로고 이미지"/></a>
                </div>
            </div>

            <!-- 로그인 페이지로 이동 -->
            <div class="login-container">
                <h2 class="login-title">이미 회원이신가요?</h2>
                <a class="login-cta" href="../pages/login.html">로그인</a>
            </div>
        </div>
        <script src="../js/signup.js"></script>
    </main>
    
</body>
</html>
