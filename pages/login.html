<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="icon" href="../assets/images/branding/ic_panda_logo.svg"/>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
  </head>
  
  <body>
    <main class="main-container">

      <div class="login-container">

        <!-- 상단 로고 -->
        <a href="../index.html" class="branding">
          <img class="panda-logo" src="../assets/images/branding/ic_panda_logo.svg" alt="판다마켓 아이콘">
          <h1 class="site-name"> 판다마켓</h1>
        </a>

        <!-- 로그인 폼 -->
        <form class="login-form" action="#" method="post">
          <div class="form-group">
            <label class ="form-label" for="user-email">이메일</label>
            <input class="form-input" type="email" placeholder="이메일을 입력해주세요" id="user-email">
          </div>

          <div class="form-group">
            <label class ="form-label" for="user-password">비밀번호</label>
            <div class="form-password">
              <input class="form-input" type="password" placeholder="비밀번호를 입력해주세요" id="user-password">
              <button type="button" class="visibility-btn clickable"><img src="../assets/images/icons/btn_visibility_off_24px.svg"/></button>
            </div>
            
          </div>  
          <button class="form-btn clickable" type="submit">로그인</button>
        </form>

        <!-- 간편로그인 -->
        <div class="login-social">
          <h2 class="social-title">간편 로그인하기</h2>
          <div class="social-btn">
           <a href="https://www.google.com/"><img src="../assets/images/icons/ic_google.png" alt="구글 아이콘"></a>
           <a href="https://www.kakaocorp.com/page/"><img src="../assets/images/icons/ic_kakaotalk.png" alt="카카오톡 아이콘"></a>
         </div>  
        </div>

        <!-- 회원가입 안내 -->
        <div class="signup-container">
          <h3 class="signup-title">판다마켓이 처음이신가요?</h3>
          <a class="signup-cta" href="./signup.html">회원가입</a>
        </div>
      </div>
    </main>
  </body>
</html>
