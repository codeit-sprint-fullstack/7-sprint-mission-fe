<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://celebrated-cucurucho-985c3d.netlify.app/login"/>
    <meta property="og:title" content="판다마켓 - 로그인"/>
    <meta property="og:image" content="image/img_pandaface.svg"/>
    <meta property="og:description" content="일상의 모든 물건을 거래해 보세요"/>

    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/login.css">
    <link rel="icon" href="image/img_pandaface.svg" type="image/x-icon" />

    <title>판다마켓 로그인</title>
</head>
<body>
    <a href="index.html"> 
        <div class="logo">
        <img src="image/img_pandaface.svg" alt="로고" width="396">
        <p>판다마켓<p>
        </div>
    </a>  
  
    <br>
    <div class="wrapper">
        <div class="main"> 
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요">
            <p id="email-error" style="color: red; font-size: 12px; display: none;"></p>
            
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요">
            <p id="password-error" style="color: red; font-size: 12px; display: none;"></p>

            <button type="submit" class="button pill-button full-width">
                로그인</button>
            <div class="sns">
                <p>간편 로그인하기</p>
                <div class="gk">
                    <a href="http://www.google.com">
                        <img src="google.png" alt="구글로그인" width="42" height="42">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="kakao.png" alt="카카오로그인" width="42" height="42">
                    </a>
                </div>
            </div>
        </div>
        <br><br>
        <p>판다마켓이 처음이신가요? <span> <a href="signup.html">회원가입</a></span></p>
        </div>
    </div>
    <div id="error-modal" class="modal">
      <div class="modal-conteent">
        <p id="modal-message"></p>
        <button id="confirm-button" class="confirm-button">확인</button>
      </div>
    </div>

</body>
</html>
