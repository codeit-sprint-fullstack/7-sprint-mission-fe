<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img_pandaface.svg" type="image/x-icon" />
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style_login.css">
    <title>판다마켓 로그인</title>
</head>
<body>
    
    <a href="index.html"> 
        <div class="logo">
        <img src="img_pandaface.svg" alt="로고" width="396">
        <p>판다마켓<p>
    </a>  
    </div>
    <br>
    <div class="wrapper">
        <div class="main"> 
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요">
            <p id="email-error" style="color: red; font-size: 12px; display: none;"></p>
            
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요">
            <p id="password-error" style="color: red; font-size: 12px; display: none;"></p>

            <button type="submit" class="button pill-button full-width">
                로그인</button>
            <div class="sns">
                <p>간편 로그인하기</p>
                <div class="gk">
                    <a href="http://www.google.com">
                        <img src="google.png" alt="구글로그인" width="42" height="42">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="kakao.png" alt="카카오로그인" width="42" height="42">
                    </a>
                </div>
            </div>
        </div>
        <br><br>
        <p>판다마켓이 처음이신가요? <span> <a href="signup.html">회원가입</a></span></p>
        </div>
    </div>
    <script>
        const emailInput = document.getElementById("email");
        const emailError = document.getElementById("email-error");
        const passwordInput = document.getElementById("password");
      

        emailInput.addEventListener("blur", function () {
          const email = emailInput.value;
      
          if (email === "") {
            emailInput.style.border = "1px solid red";
            emailError.textContent = "이메일을 입력해주세요.";
            emailError.style.display = "block";
          } else if (!(email.includes("@") && email.includes("."))) {
            emailInput.style.border = "1px solid red";
            emailError.textContent = "잘못된 이메일 형식입니다.";
            emailError.style.display = "block";
          } else {
            emailInput.style.border = "1px solid #ccc";
            emailError.style.display = "none";
          }
        });
      
        // 버튼 눌렀을 때 검사
        document.querySelector("button").addEventListener("click", function (e) {
          e.preventDefault();
      
          const email = emailInput.value.trim();
          const password = passwordInput.value.trim();
      
          if (!(email.includes("@") && email.includes("."))) {
            alert("잘못된 이메일 형식입니다.");
            return;
          }
      
          if (password.length < 8) {
            alert("비밀번호를 8자 이상 입력해주세요.");
            return;
          }
      
          alert("로그인 정보가 유효합니다!");
        });
      </script>
</body>
</html>
