<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website"/>

    <meta property="og:title" content="판다마켓 - 회원가입"/>
    <meta property="og:image" content="image/img_pandaface.svg"/>
    <meta property="og:description" content="일상의 모든 물건을 거래해 보세요"/>

    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/signup.css">
    <link rel="icon" href="image/img_pandaface.svg" type="image/x-icon" />
    <title>판다마켓 회원가입</title>

<body>
    <div class="logo">
        <a href="index.html">
        <img src="image/img_pandaface.svg" alt="로고">
        <p>판다마켓</p>
        </a>
    </div>
    <div class="wrapper">
        <div class="signup_logo"></div>
        <div class="main">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요">
            <label for="nickname">닉네임</label>
            <input type="nickname" id="nickname" name="nickname" placeholder="닉네임을 입력해주세요">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요">
            <label for="password-confirm">비밀번호 확인</label>
            <input type="password" id="password-confirm" name="password-confirm" placeholder="비밀번호를 다시 한 번 입력해주세요"> 

            <button>회원가입</button>
    
            <div class="sns">
                <p>간편 로그인하기</p>
                <div class="gk">
                    <a href="http://www.google.com">
                        <img src="image/google-logo.png" alt="구글로그인" width="30" height="30">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="image/kakao.png" alt="카카오로그인" width="30" height="30">
                    </a>
                </div>
            </div>
        </div>
        <br>
        <p>이미 회원이신가요? <a href="login.html"> 로그인 </a> </p>
    </div>
