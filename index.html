<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="reset.css"/>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="inlinestyle">
      <div class="logo">
        <img src="../img/icon_panda.svg" rel="판다아이콘"/>
        <p>판다마켓</p>
      </div>     <!--판다로고,판다마켓-->
      <div class="header_login_btn">
        <a>로그인</a>
      </div>     <!--로그인 버튼-->
    </div>
  </header>
  <main>
    <div class="tophome">
      <div class="topinline">
        <div class="topgap">
          <p class="tophome_text">
            <span>일상의 모든 물건을</span>
            <span>거래해 보세요</span></p>
          <a class="">구경하러 가기</a>
        </div>  <!--글씨및 버튼-->
        <div>
          <img src="../img/Img_home_top.png" alt="판다이미지"/>
        </div>  <!--판다그림-->
      </div>
    </div>
    <section class="section_f">
      <div class="sectioninline">
        <div>
          <img src="../img/Img_home_01.png" alt="홈 사진1"/>
        </div>    <!--이미지-->
        <div>
          <div class="section_text">
            <p class="top">Hot item</p>
            <p class="mid">
              <span>인기 상품을</span>
              <span>확인해 보세요</span>
            </p>
            <p class="bot">
              <span>가장 HOT한 중고거래 물품을</span>
              <span>판다 마켓에서 확인해 보세요</span>
            </p>
          </div>  <!--3개블럭 글씨-->
        </div>
      </div>
    </section>
    <section>
      <div class="sectioninline">
        <div>  <!--3개블럭 글씨-->
          <div class="section_text section_text_right">
            <p class="top">Search</p>
            <p class="mid">
              <span>구매를 원하는</span>
              <span>상품을 검색하세요</span>
            </p>
            <p class="bot">
              <span>구매하고 싶은 물품은 검색해서</span>
              <span>쉽게 찾아보세요</span>
            </p>
          </div>
        </div>
        <div> <!--이미지-->
          <img src="../img/Img_home_02.png" alt="홈 사진1"/>
        </div>
      </div>
    </section>
    <section>
      <div class="sectioninline">
        <div>
          <img src="../img/Img_home_03.png" alt="홈 사진3"/>
        </div>    <!--이미지-->
        <div>
          <div class="section_text">
            <p class="top">Register</p>
            <p class="mid">
              <span>판매를 원하는</span>
              <span>상품을 등록하세요</span>
            </p>
            <p class="bot">
              <span>어떤 물건이든 판매하고 싶은 상품을</span>
              <span>쉽게 등록하세요</span>
            </p>
          </div>  <!--3개블럭 글씨-->
        </div>
      </div>
    </section>
    <div>
      <div>
        <div></div>    <!--글씨-->
        <div></div>    <!--판다이미지-->
      </div>
    </div>
  </main>
  <footer>
  <div>
    <div></div>
    <div></div>
    <div></div>
  </div>
  </footer>
</body>
</html>
