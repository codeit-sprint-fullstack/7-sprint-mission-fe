<!DOCTYPE html>

<html>
    <head>
        <title>판다마켓</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="./css/style.css">
    </head>
    <body>
        <!-- 여기서 화면 크기가 1920px보다 작아질 때
         패딩 너비를 400에서 200px로 줄이는 방법을 모르겠음-->
        <header>
            <div class="header">
                <a class="logo-text link" href="index.html">
                    <img class="logo" src="./image/panda_logo.svg" alt="판다 로고 아이콘">
                    <h1>판다마켓</h1>
                </a>
                <a class="login link" href="login.html">
                    로그인
                </a>
            </div>
        </header>
        
        <section class="top image">
            <div class="top-image-main">
                <div class="top-image-text">
                    <h2>일상의 모든 물건을<br>
                        거래해 보세요</h2>
                    <a href="items.html" class="items link">구경하러 가기</a>
                </div>
                <img class="top-image" src="./image/Img_home_top.png" alt="상단 이미지">
            </div>
        </section>

        <main> 
            <section class="main hot-item">
                <div class="hot-item-main">
                    <img class="section-image" src="./image/Img_home_01.png" alt="메인 1번 섹션 이미지">
                    <div class="section-main-text">
                        <p class="section-title">Hot item</p>
                        <h2>
                            인기 상품을 <br>
                            확인해 보세요
                        </h2>
                        <p class="section-text">가장 HOT한 중고거래 물품을<br>
                            판다 마켓에서 확인해 보세요</p>
                    </div>    
                </div>   
            </section>

            <section class="main search">
                <div class="search-main">
                    <div class="search-main-text section-main-text">
                        <p class="section-title">Search</p>
                        <h2>
                            구매를 원하는<br>
                            상품을 검색하세요
                        </h2>
                        <p class="section-text">구매하고 싶은 물품은 검색해서<br>
                            쉽게 찾아보세요</p>
                    </div>
                    <img class="section-image" src="./image/Img_home_02.png" alt="메인 2번 섹션 이미지">    
                </div>
            </section>

            <section class="main register">
                <div class="register-main">
                    <img class="section-image" src="./image/Img_home_03.png" alt="메인 3번 섹션 이미지">
                    <div class="section-main-text">
                        <p class="section-title">Register</p>
                        <h2>
                            판매를 원하는<br>
                            상품을 등록하세요
                        </h2>
                        <p class="section-text">어떤 물건이든 판매하고 싶은 상품을<br>
                            쉽게 등록하세요</p>
                    </div>    
                </div>    
            </section>
        </main>

        <section class="bottom image">
            <div class="bottom-image-main">
                <div class="bottom-image-text">
                    <h2> 믿을 수 있는 <br>
                        판다마켓 중고 거래</h2>
                </div>    
                <img class="bottom-image" src="./image/Img_home_bottom.png" alt="하단 이미지">
            </div>
        </section>

        <footer> 
            <!-- privacy policy와 faq를 정확히 정중앙에 오게 하는 방법이 뭐지..
             이런식으로 요소가 여러 개 있고, 각각 요소의 크기가 다를 때
             어떤 특정한 요소 하나를 해당 구역의 정중앙에 위치시키는 방법이 헷갈린다-->
            <div class="footer">
                <div class="footer-text">
                    @codeit - 2024
                </div>
                <div class="footer-links">
                    <a class="link" href="privacy.html">Privacy Policy</a>
                    <a class="link" href="faq.html">FAQ</a>
                </div>
                <!--사진+href 하는 방법이 이게 맞나?-->
                <div class="footer-icons">
                    <a class="icon link" target="_blank" href="https://www.facebook.com">
                        <img src="./image/ic_facebook.png" alt="페이스북 아이콘">
                    </a>
                    <a class="icon link" target="_blank" href="https://twitter.com">
                        <img src="./image/ic_twitter.png" alt="트위터 아이콘">
                    </a>
                    <a class="icon link" target="_blank" href="https://www.youtube.com">
                        <img src="./image/ic_youtube.png" alt="유투브 아이콘">
                    </a>
                    <a class="icon link" target="_blank" href="https://www.instagram.com">
                        <img src="./image/ic_instagram.png" alt="인스타그램 아이콘">
                    </a>
                </div>
            </div>
        </footer>
    </body>        
</html>
