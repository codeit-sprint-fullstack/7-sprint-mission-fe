<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="./panda_market/ic_pandamarket.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="reset.css" />
  </head>

  <body>
    <!-- 판다마켓의 헤더 부분 -->
    <header class="top">
      <div class="logo-title">
        <img class="logo" src="./panda_market/ic_pandamarket.svg" alt="판다마켓 아이콘 사진"/>
        <h1 class="title">판다마켓</h1>
      </div>
      <a class="login" href="login.html">로그인</a>
    </header>

    <main class="mainpage">

      <!-- 판다마켓의 탑배너 -->
      <section class="hero">
        <div class="hero-inner">
          <div class="title-cta">
            <h3 class="hero-subtitle">일상의 모든 물건을<br />거래해 보세요</h3>
            <a class="hero-cta clickable" href="items.html">구경하러 가기</a>
          </div>
          <img class="hero-image" src="./images/index/Img_home_top.png" alt="홈 탑화면 이미지"/>
        </div>
      </section>

      <!-- 판다마켓의 첫번째 section : hot-item -->
      <div class="container hot-items">
        <a href="hot_item.html" class ="container-inner">
          <img src="./images/index/hot_item.png" alt="핫아이템 이미지" />
          <div class="container-text">
            <h2>Hot item</h2>
            <h3>인기 상품을<br />확인해 보세요</h3>
            <p>가장 핫 한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</p>
          </div>
        </a>
      </div>

      <!-- 판다마켓의 두번째 section : search-guide -->
      <section class="container search-guide">
        <a href="search.html" class="container-inner">
          <div class="container-text">
            <h2>Search</h2>
            <h3>구매를 원하는<br>상품을 검색하세요</h3>
            <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
          </div>
          <img src="./images/index/search.png" alt="인기상품 이미지" />
        </a>
      </section>

      <!-- 판다마켓의 세번째 section : register-info -->
      <section class="container register-info">
        <a href="register.html" class="container-inner">
          <img src="./images/index/register.png" alt="인기상품 이미지" />
          <div class="container-text">
            <h2>Register</h2>
            <h3>판매를 원하는<br>상품을 등록하세요</h3>
            <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
          </div>
        </a>
      </section>

      <!-- 판다마켓의 하단배너 -->
      <section class="trust-banner">
        <div class="trust-inner">
          <h3 class="trust-text">믿을 수 있는 <br>판다마켓 중고 거래</h3>
          <img src="./images/index/Img_home_bottom.png" alt="바텀 판다 이미지"/>
        </div>
      </section>
    </main>
    
    <!-- 판다마켓의 footer -->
    <footer class="footer-panda">
      <div class="footer-inner">
        <div class="footer-left">
          <p>@codeit - 2024</p>
        </div>
        <nav class="footer-nav">
          <a href="privacy.html" target="_blank">Privacy Policy</a>
          <a href="faq.html" target="_blank">FAQ</a>
        </nav>
        <ul class="social-list">
          <li>
            <a href="https://www.facebook.com/" target="_blank"><img src="./icons/ic_facebook.png" alt="페이스북 아이콘" /></a>
          </li>
          <li>
            <a ref="https://www.x.com/" target="_blank"><img src="./icons/ic_twitter.png" alt="트위터 아이콘" /></a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank"><img src="./icons/ic_youtube.png" alt="유튜브 아이콘" /></a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank"><img src="./icons/ic_instagram.png" alt="인스타그램 아이콘"/></a>
          </li>
        </ul>
      </div>
    </footer>

  </body>

</html>
