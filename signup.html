<!DOCTYPE html>

<html>
    <head>
        <title>회원가입</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="signup-style.css">
    </head>

    <body>
        <main>
            <a class="logo-title link" href="index.html">
                <img class="logo-icon" src="panda_logo.svg" alt="판다 로고 아이콘">
                <h1>판다마켓</h1>
            </a>
            <form>
                <div class="email inputbox">
                    <label class="label" for="email">이메일</label>
                    <input 
                    id="email" 
                    class="" 
                    name="email" 
                    type="email" 
                    placeholder="이메일을 입력해주세요" 
                    required
                    autocomplete="off">
                </div>
                <div class="nickname inputbox">
                    <label class="label" for="nickname">닉네임</label>
                    <input id="nickname" name="email" placeholder="닉네임을 입력해주세요" required>
                </div>
                <div class="password inputbox">
                    <label class="label" for="password" >비밀번호</label>
                    <input
                    id="password"
                    name="password"
                    class=""
                    placeholder="비밀번호를 입력해주세요"
                    type="password"
                    required>
                </div>
                <div class="password-check inputbox">
                    <label class="label" for="password-check">비밀번호 확인</label>
                    <input
                    id="password-check"
                    name="password"
                    class=""
                    placeholder="비밀번호를 다시 한 번 입력해주세요"
                    type="password"
                    required>
                </div>
                <button class="login-button" type="submit">
                    <div class="login-button-text">회원가입</div>
                </button>
            </form>

            <section class="simple-login">
                <div class="simple-login-main">
                    <p class="simple-login-text">간편 로그인하기</p>
                    <a class="google link" href="https://www.google.com/">
                        <img src="google.svg" alt="구글 아이콘">
                    </a>
                    <a class="kakaotalk link" href="https://www.kakaocorp.com/page/">
                        <img src="kakaotalk.svg" alt="카카오톡 아이콘">
                    </a>
                </div>
            </section>

            <div class="signup-main">
                이미 회원이신가요?
                <a class="signup link" href="login.html">로그인</a>
            </div>

        </main>
        <script src="script_signup.js"></script>

    </body>
</html>
