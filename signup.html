<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="loginstyle.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header></header>
    <main>
      <div class="login_box">
        <!--가운데 박스-->
        <div class="logo_box_botgap">
          <div class="login_logo">
            <a href="/"><img src="./img/icon_panda.svg" rel="판다아이콘" /></a>
            <p class="rokaf_font">판다마켓</p>
          </div>
        </div>
        <!--로고-->
        <div>
          <form>
            <!--이메일 ,비밀번호 로그인-->
            <div class="email_box">
              <!--이메일-->
              <label>이메일</label>
              <input
                class="focus_line validation_id"
                type="email"
                placeholder="이메일을 입력해주세요"
              />
            </div>
            <div class="nickname_box">
              <!--비밀번호-->
              <label>닉네임</label>
              <input
                class="focus_line validation_nick"
                type="text"
                placeholder="닉네임을 입력해주세요"
              />
            </div>
            <div class="password_box">
              <!--비밀번호-->
              <label>비밀번호</label>
              <div class="input_icon_box">
                <input
                  type="password"
                  placeholder="비밀번호을 입력해주세요"
                  class="passwordTarget focus_line validation_pw"
                />
                <i class="fa-solid fa-eye-slash icon_eye icon_position"></i>
              </div>
            </div>
            <div class="confirm_box">
              <!--비밀번호-->
              <label>비밀번호 확인</label>
              <div class="input_icon_box">
                <input
                  type="password"
                  placeholder="비밀번호을 입력해주세요"
                  class="passwordTarget focus_line validation_conf"
                />
                <i class="fa-solid fa-eye-slash icon_eye icon_position"></i>
              </div>
            </div>
            <button class="sign_button" type="button" disabled>회원가입</button>
          </form>
        </div>
        <div class="conv_login">
          <div>
            <p>간편 로그인하기</p>
          </div>
          <div class="conv_login_gap">
            <a href="https://www.google.com/%E2%80%9D"
              ><img src="./img/Component 2.png"
            /></a>
            <a href="https://www.kakaocorp.com/page/%E2%80%9D"
              ><img src="./img/component1.png"
            /></a>
          </div>
        </div>
        <!--간편로그인-->
        <div>
          <p class="signup_text">
            이미 회원이신가요? <a class="signup" href="/login">로그인</a>
          </p>
        </div>
        <!--회원가입 칸-->
      </div>
    </main>
    <!-- 모달창 -->
    <div class="overlay"></div>
    <div class="login_modal">
      <!--모달창을 감싸는 div -->
      <div class="modal_box">
        <!--모달창내에서 가운데-->
        <p>사용 중인 이메일입니다.</p>
        <button class="modal_button">확인</button>
      </div>
    </div>
    <footer></footer>
  </body>
  <script type="module" src="signup.js"></script>
</html>
