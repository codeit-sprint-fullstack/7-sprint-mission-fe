<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 판다마켓</title>
  <link rel="stylesheet" href="./login_signup.css" />
  <link rel="stylesheet" href="./reset.css" />
</head>

  <body class="entire" >
    <main class="container">
      <section class="logo_pandamarket">
        <a href="/index.html">
          <img src="/logo_pandamarket.svg" alt="로고" />
        </a>
      </section>
      <form class="login-wrapper" method="post" action="/index.html" >
        <section class="email">
          <h2 class="text">이메일</h2>
          <input class="text-input" type="email" name="userName" placeholder="이메일을 입력해주세요" required>
        </section>
        <section class="nickname">
          <h2 class="text">닉네임</h2>
          <input class="text-input" type="nickname" name="userNickname" placeholder="닉네임을 입력해주세요" required>
        </section>
        <section class="pswd">
          <h2 class="text">비밀번호</h2>
          <div class="input-wrapper">
            <input class="text-input" type="password" name="userPassword" placeholder="비밀번호를 입력해주세요" required />
            <button type="button" class="btn-visibility">
              <img src="btn_visibility_on_24px.png" alt="비밀번호 표시" />
            </button>
          </div>
        </section>
        <section class="pswd">
          <h2 class="text">비밀번호 확인</h2>
          <div class="input-wrapper">
            <input class="text-input" type="password" name="userPasswordConfirm" placeholder="비밀번호를 다시 한 번 입력해주세요" required />
            <button type="button" class="btn-visibility">
              <img src="btn_visibility_on_24px.png" alt="비밀번호 표시" />
            </button>
          </div>
        </section>
        <section>
          <button type="submit" class="signup" id="signupButton">
            <div class="signup-text">회원가입</div>
          </button>
        </section>
        <section class="easylogin" >
          <div class="inner">
            <h2 class="e-l-text">간편 로그인하기</h2>
          <div class="google-kakao">
            <a href="https://www.google.com/" target="_blank">
              <img src="/google.png" alt="구글페이지" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img src="/kakao.svg" alt="카카오페이지" />
            </a>
          </div>
          </div>
        </section>
        <section class="text-to-login">
          <h2 class="first-login-text">이미 회원이신가요?</h2>
          <a class="login-link" href="/login.html">로그인</a>
        </section>
        </div>
      </form>
      <script src="form-signup.js"></script>
    </main>
  </body>
  <div id="signupModal" class="modal hidden">
    <div class="modal-content">
      <p id="signupModalMessage"></p>
      <button id="signupModalConfirmButton">확인</button>
    </div>
  </div>
</html>
