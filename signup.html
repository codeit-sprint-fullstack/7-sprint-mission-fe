<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="img_pandaface.svg" type="image/x-icon" />
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style_signup.css">
    <title>판다마켓 회원가입</title>
</head>
<body>
    <div class="logo">
        <a href="index.html">
        <img src="./img_pandaface.svg" alt="로고">
        <p>판다마켓</p>
        </a>
    </div>
    <div class="wrapper">
        <div class="signup_logo"></div>
        <div class="main">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요">
            <label for="nickname">닉네임</label>
            <input type="nickname" id="nickname" name="nickname" placeholder="닉네임을 입력해주세요">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요">
            <label for="password">비밀번호 확인</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 다시 한 번 입력해주세요"> 

            <button>회원가입</button>
    
            <div class="sns">
                <p>간편 로그인하기</p>
                <div class="gk">
                    <a href="http://www.google.com">
                        <img src="google.png" alt="구글로그인" width="30" height="30">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="kakao.png" alt="카카오로그인" width="30" height="30">
                    </a>
                </div>
            </div>
        </div>
        <br>
        <p>이미 회원이신가요? <span> <a href="login.html"> 로그인 </a></span></p>
    </div>

    
</body>
</html>
