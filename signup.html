<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <link rel="stylesheet" href="reset.css"/>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loginstyle.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header></header>
  <main>
    <div class="loginbox">   <!--가운데 박스-->
      <div class="logobox_botgap">
        <div class="login_logo">
          <a href="/"><img src="./img/icon_panda.svg" rel="판다아이콘"/></a>
          <p class="rokaf_font">판다마켓</p>
        </div> 
      </div>  <!--로고-->
      <div>
      <form>    <!--이메일 ,비밀번호 로그인-->
        <div class="emailbox"> <!--이메일-->
          <label>이메일</label>
          <input type="email" placeholder="이메일을 입력해주세요"/>
        </div> 
        <div class="passwordbox"> <!--비밀번호-->
          <label>닉네임</label>
          <input type="text" placeholder="닉네임을 입력해주세요" />
        </div>
        <div class="passwordbox"> <!--비밀번호-->
          <label>비밀번호</label>
          <input type="password" placeholder="비밀번호을 입력해주세요" />
          <i class="fa-solid fa-eye-slash icon_eye"></i>
        </div>
        <div class="passwordbox"> <!--비밀번호-->
          <label>비밀번호 확인</label>
          <input type="password" placeholder="비밀번호을 다시 한 번 입력해주세요" />
          <i class="fa-solid fa-eye-slash icon_eye"></i>
        </div>
        <button>로그인</button>
      </form>
    </div>
      <div class="conv_login">
        <div>
          <p>간편 로그인하기</p>
        </div>
        <div class="conv_login_gap">
          <a href="https://www.google.com/%E2%80%9D"><img src="./img/Component 2.png"/></a>
          <a href="https://www.kakaocorp.com/page/%E2%80%9D"><img src="./img/component1.png"/></a>
        </div>
      </div>  <!--간편로그인-->
      <div>
        <p class="signup_text">이미 회원이신가요? <a class="signup" href="/login">로그인</a></p>
      </div>  <!--회원가입 칸-->
    </div>
  </main>
  <footer></footer>
  
</body>
</html>
