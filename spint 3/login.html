<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img_pandaface.svg" type="image/x-icon" />
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style_login.css">
    <title>판다마켓 로그인</title>
</head>
<body>
    <script>
        document.querySelector("button").addEventListener("click", function (e) {
          e.preventDefault();
      
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
      
          if (!(email.includes("@") && email.includes("."))) {
            alert("잘못된 이메일 형식입니다.");
            return;
          }
      
          // 비밀번호 6자 이상 확인
          if (password.length < 8) {
            alert("비밀번호를 8자 이상 입력해주세요.");
            return;
          }
      
          // 통과
          alert("로그인 정보가 유효합니다!");
          // 여기서 실제 제출 동작 실행 가능
          // 예: document.querySelector("form").submit();
        });
      </script>
    <a href="index.html"> 
        <div class="logo">
        <img src="img_pandaface.svg" alt="로고" width="396">
        <p>판다마켓<p>
    </a>  
    </div>
    <br>
    <div class="wrapper">
        <div class="main"> 
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="이메일을 입력해주세요">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요">
            <button type="submit" class="button pill-button full-width">
                로그인</button>
            <div class="sns">
                <p>간편 로그인하기</p>
                <div class="gk">
                    <a href="http://www.google.com">
                        <img src="google.png" alt="구글로그인" width="42" height="42">
                    </a>
                    <a href="https://www.kakaocorp.com/page/">
                        <img src="kakao.png" alt="카카오로그인" width="42" height="42">
                    </a>
                </div>
            </div>
        </div>
        <br><br>
        <p>판다마켓이 처음이신가요? <span> <a href="signup.html">회원가입</a></span></p>
        </div>
    </div>
</body>
</html>
