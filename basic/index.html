<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
    <div class="wrap">
        <header>
            <div class="inner">
                <div class="logo">
                    <h1>
                        <span>판다마켓</span>
                        <a href="./">
                            <img src="./img/common/logo.svg" alt="판다마켓" />
                        </a>
                    </h1>
                </div>
                <div class="util">
                    <a href="./html/member/login.html" class="btn active login">로그인</a>
                </div>
            </div>
        </header>
        <main>
            <section class="banner-area">
                <div class="inner">
                    <div class="txt-area">
                        <h2>일상의 모든 물건을<br />
                            거래해 보세요</h2>
                        <a href="#" class="btn active">구경하러 가기</a>
                    </div>
                    <div class="img-area">
                        <img src="./img/main/img_home_top.png" alt="판다 이미지" />
                    </div>
                </div>
            </section>
            <section class="content-area">
                <article>
                    <div class="img-area">
                        <img src="./img/main/img_home_01.png" alt="이미지" />
                    </div>
                    <div class="txt-area">
                        <span>Hot item</span>
                        <h3>인기 상품을<br />
                            확인해 보세요</h3>
                        <p>가장 HOT한 중고거래 물품을<br />
                            판다 마켓에서 확인해 보세요.</p>
                    </div>
                </article>
                <article class="row-reverse">
                    <div class="img-area">
                        <img src="./img/main/img_home_02.png" alt="이미지" />
                    </div>
                    <div class="txt-area">
                        <span>Search</span>
                        <h3>구매를 원하는<br />
                            상품을 검색하세요</h3>
                        <p>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</p>
                    </div>
                </article>
                <article>
                    <div class="img-area">
                        <img src="./img/main/img_home_03.png" alt="이미지" />
                    </div>
                    <div class="txt-area">
                        <span>Register</span>
                        <h3>판매를 원하는<br />
                            상품을 등록하세요</h3>
                        <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요.</p>
                    </div>
                </article>
            </section>
            <section class="banner-area">
                <div class="inner">
                    <div class="txt-area">
                        <h2>믿을 수 있는<br />
                            판다마켓 중고 거래</h2>
                    </div>
                    <div class="img-area">
                        <img src="./img/main/img_home_bottom.png" alt="판다 이미지" />
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <div class="inner">
                <ul class="sns-list">
                    <li>
                        <a href="https://www.facebook.com/" target="_blank">
                            <img src="./img/common/ic_facebook.png" alt="페이스북" />
                        </a>
                    </li>
                    <li>
                        <a href="https://x.com/" target="_blank">
                            <img src="./img/common/ic_twitter.png" alt="트위터" />
                        </a>
                    </li>
                    <li>
                        <a href="https://x.com/" target="_blank">
                            <img src="./img/common/ic_youtube.png" alt="유튜브" />
                        </a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/" target="_blank">
                            <img src="./img/common/ic_instagram.png" alt="인스타그램" />
                        </a>
                    </li>
                </ul>
                <ul class="f-util">
                    <li>
                        <a href="./html/privacy/">
                            Privacy Policy
                        </a>
                    </li>
                    <li>
                        <a href="./html/faq/">
                            FAQ
                        </a>
                    </li>
                </ul>
                <p class="copyright">&copy;codeit - 2024</p>
            </div>
        </footer>
    </div>
</body>
</html>
